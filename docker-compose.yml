version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
