<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvianVision AI — Wildlife Computer Vision Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060a0f;
      --surface: #0e141e;
      --surface-raised: #141c2a;
      --border: #1e293b;
      --brand: #10b981;
      --brand-glow: rgba(16, 185, 129, 0.25);
      --accent: #06b6d4;
      --amber: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* NAV */
    nav { background: rgba(14, 20, 30, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 900; color: #fff; }
    .brand-icon { background: linear-gradient(135deg, #10b981 0%, #047857 100%); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
    .status-pill { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1.5px solid #10b981; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }

    /* WORKSPACE */
    main { flex: 1; max-width: 1600px; margin: 0 auto; width: 100%; padding: 28px 36px; display: grid; grid-template-columns: 1fr 420px; gap: 28px; }
    
    /* CANVAS SECTION */
    .viewport-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; }
    .viewport-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .preset-btns { display: flex; gap: 8px; }
    .btn-preset { background: var(--surface-raised); border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.15s; }
    .btn-preset.active, .btn-preset:hover { background: rgba(16, 185, 129, 0.15); color: var(--brand); border-color: var(--brand); }
    .canvas-container { position: relative; width: 100%; height: 520px; background: #020408; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
    canvas#video-canvas { width: 100%; height: 100%; display: block; }
    .canvas-hud { position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #38bdf8; border: 1px solid rgba(255,255,255,0.1); }

    /* TELEMETRY SIDEBAR */
    .sidebar { display: flex; flex-direction: column; gap: 20px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; text-align: center; }
    .stat-val { font-size: 28px; font-weight: 900; font-family: 'JetBrains Mono', monospace; color: #fff; }
    .stat-lbl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

    /* DETECTIONS LIST */
    .detections-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .detection-items { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; max-height: 380px; }
    .det-item { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
    .det-header { display: flex; justify-content: space-between; align-items: center; }
    .species-name { font-size: 15px; font-weight: 800; color: #fff; }
    .conf-badge { background: rgba(16, 185, 129, 0.15); color: #34d399; font-weight: 800; font-size: 11px; padding: 2px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; }
    .latin-name { font-size: 12px; font-style: italic; color: #94a3b8; }
    .det-footer { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: #64748b; margin-top: 4px; font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav>
    <div class="brand">
      <div class="brand-icon">🦅</div>
      <span>AVIANVISION AI — WILDLIFE CV</span>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>YOLOv8 INFERENCE ENGINE ONLINE</span>
    </div>
  </nav>

  <!-- MAIN -->
  <main>
    <!-- OBSERVATION CANVAS -->
    <div class="viewport-card">
      <div class="viewport-top">
        <h2 style="font-size:18px; font-weight:800;">Live Canopy Video Stream</h2>
        <div class="preset-btns">
          <button class="btn-preset active" onclick="switchPreset('wetland')">Wetland Canopy #4</button>
          <button class="btn-preset" onclick="switchPreset('alpine')">Alpine Ridge</button>
          <button class="btn-preset" onclick="switchPreset('coastal')">Coastal Estuary</button>
        </div>
      </div>
      <div class="canvas-container">
        <canvas id="video-canvas"></canvas>
        <div class="canvas-hud" id="hud-stats">FEED: FOREST CANOPY WETLAND #4 • 60 FPS • 1080P</div>
      </div>
    </div>

    <!-- TELEMETRY SIDEBAR -->
    <div class="sidebar">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-val" style="color:#34d399;" id="birds-now">3</div>
          <div class="stat-lbl">Birds Visible</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="color:#38bdf8;" id="total-tracks">14</div>
          <div class="stat-lbl">Unique Tracks</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="color:#fbbf24; font-size:18px; line-height:34px;" id="flock-dir">North-East</div>
          <div class="stat-lbl">Dominant Vector</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="color:#c084fc; font-size:18px; line-height:34px;" id="fps-stat">58.4 FPS</div>
          <div class="stat-lbl">Inference Rate</div>
        </div>
      </div>

      <!-- DETECTIONS -->
      <div class="detections-card">
        <div class="card-title">
          <span>Identified Avian Species</span>
          <span style="font-size:12px; color:var(--muted);" id="det-count">3 Active</span>
        </div>
        <div class="detection-items" id="detections-list">
          <!-- POPULATED BY CV ENGINE -->
        </div>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('video-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 900;
    canvas.height = 520;

    let birds = [
      { id: 1, name: "Bald Eagle", latin: "Haliaeetus leucocephalus", conf: 0.984, x: 140, y: 110, w: 180, h: 160, vx: 1.2, vy: -0.6, color: "#10b981" },
      { id: 2, name: "Peregrine Falcon", latin: "Falco peregrinus", conf: 0.941, x: 420, y: 220, w: 140, h: 120, vx: 2.1, vy: -1.1, color: "#06b6d4" },
      { id: 3, name: "American Robin", latin: "Turdus migratorius", conf: 0.892, x: 620, y: 160, w: 110, h: 100, vx: 0.8, vy: 0.4, color: "#f59e0b" }
    ];

    function draw() {
      ctx.fillStyle = '#05111a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw background foliage aesthetic
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }

      // Draw each bird and bounding box
      birds.forEach(b => {
        // Animate movement
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 50 || b.x + b.w > canvas.width - 50) b.vx *= -1;
        if (b.y < 50 || b.y + b.h > canvas.height - 50) b.vy *= -1;

        // Draw bounding box
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        // Header tag
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y - 28, b.w, 28);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 13px "Plus Jakarta Sans"';
        ctx.fillText(`${b.name} (${Math.round(b.conf * 100)}%)`, b.x + 8, b.y - 10);

        // Center crosshair
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(b.x + b.w/2, b.y + b.h/2, 4, 0, Math.PI*2);
        ctx.stroke();
      });

      requestAnimationFrame(draw);
    }

    function renderDetectionsList() {
      const list = document.getElementById('detections-list');
      list.innerHTML = birds.map(b => `
        <div class="det-item" style="border-left: 3px solid ${b.color};">
          <div class="det-header">
            <span class="species-name">${b.name}</span>
            <span class="conf-badge">${Math.round(b.conf * 100)}% Match</span>
          </div>
          <div class="latin-name">${b.latin}</div>
          <div class="det-footer">
            <span>TRACK ID: #00${b.id}</span>
            <span>VECTOR: NORTH-EAST</span>
          </div>
        </div>
      `).join('');
    }

    function switchPreset(name) {
      document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('hud-stats').innerText = `FEED: ${name.toUpperCase()} CANOPY • 60 FPS • 1080P`;
    }

    draw();
    renderDetectionsList();
  </script>
</body>
</html>
